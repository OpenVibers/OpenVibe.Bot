## ═══════════════════════════════════════════════════════════════
## openvibe.bot — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.bot.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4630, systemd unit openvibe-bot) serves the REST API and
## terminates the device (`/device`), operator (`/control`) and watch (`/watch`) WebSockets; nginx terminates TLS,
## redirects www → apex, upgrades the three WebSocket routes, rate-limits sign-in, the API and the pages,
## proxies the front page, /shared/, /robots.txt and /release.json to the app, and the app itself serves
## the legal pages, sitemap.xml, manifest.webmanifest and the 404 page.
##
## No proxy_cache: the app decides cacheability per response (no-store on the API), and device and
## operator sockets must never be buffered or cached. Never log request bodies or the Authorization
## header here: the device socket carries its credential in the upgrade's Authorization header.
## ═══════════════════════════════════════════════════════════════

# WebSocket upgrade: `Connection` is hop-by-hop, so it is derived from the client's request per
# connection. This map must live in the http context (alongside the limit zones), not in a server.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=ovbot_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovbot_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.bot www.openvibe.bot;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.bot$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.bot;

    ssl_certificate     /etc/letsencrypt/live/openvibe.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.bot/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.bot$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.bot;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.bot/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.bot.access.log;
    error_log  /var/log/nginx/openvibe.bot.error.log;

    # The API accepts at most 64 kB of JSON (server/app.js); 1 MB leaves room for headers.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json application/schema+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The device socket authenticates with the credential in this header; forward it verbatim.
    proxy_set_header Authorization $http_authorization;

    # ── Device WebSocket: one outbound connection per device ──
    # Authenticated by `Authorization: Bearer <credential>` on the upgrade (never a query string).
    # Sockets are long-lived and bidirectional, so buffering is off and reads never time out.
    location = /device {
        proxy_pass http://127.0.0.1:4630;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Operator/control WebSocket: private, invite and queue access ──
    location = /control {
        proxy_pass http://127.0.0.1:4630;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Watch WebSocket: anonymous and read-only, for the embeddable panel (plan T15 R9) ──
    # No credential; the app caps sockets per address (BOT_WATCH_MAX_PER_IP) and per robot, and the
    # upgrade itself is rate-limited here like any anonymous request.
    location = /watch {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Network SSO (sign-in, callback, sign-out) ───────────
    location /auth/ {
        limit_req zone=ovbot_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }

    # ── Device installer: built and served by the app (server/config.js installer.scriptUrl) ──
    location = /install {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }

    # ── Signed-in pages: robots, pairing and the panel (server/web/routes.js) ──
    location = /robots {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }
    location ^~ /pair/ {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }
    location ^~ /panel/ {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }

    # ── Internal API: host-local callers only ────────
    # OpenVibe.Services reads the resource index, and probes read health and readiness, on port 4630 directly.
    # Exact matches and the resources prefix outrank the public /api/ location below.
    location = /api/v1/resources { return 404; }
    location ^~ /api/v1/resources/ { return 404; }
    location = /api/health { return 404; }
    location = /api/ready  { return 404; }

    # ── REST API ────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4630/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── The front page and the shared browser assets: Bot's own (server/web/home.js) ──
    # /shared/ is openvibe-shared's serve handler in the app, the same files the Frame loads everywhere.
    location = / {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }
    location ^~ /shared/ {
        proxy_pass http://127.0.0.1:4630;
    }
    # The Sites front page this replaced stays on disk until Sites drops it: never serve it by its file name.
    location = /index.html { return 301 /; }
    # robots.txt and release.json are the app's (server/web/routes.js, openvibe-shared/release); the Sites
    # copies were a placeholder's, and status.json ("stage": "placeholder") no longer describes the site.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:4630;
    }
    location = /release.json {
        proxy_pass http://127.0.0.1:4630;
    }
    location = /status.json { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:4630/internal/events directly; never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Everything else: the app. There is no static root here any more — the app serves the legal pages,
    # robots.txt, sitemap.xml, manifest.webmanifest and its own 404 page (server/app.js, server/web/routes.js). ──
    location / {
        limit_req zone=ovbot_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4630;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
